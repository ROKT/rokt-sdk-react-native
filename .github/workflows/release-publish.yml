name: Release – Publish

on:
  push:
    branches:
      - main
      - maintenance/*
    paths:
      - VERSION

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-package:
    name: Build and Package Rokt.Widget
    runs-on: ubuntu-latest
    outputs:
      package-filename: ${{ steps.build-and-package.outputs.package-filename }}
      artifact-name: ${{ steps.build-and-package.outputs.artifact-name }}
      package-sha256: ${{ steps.build-and-package.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Rokt.Widget/package-lock.json

      - name: Build and Package
        id: build-and-package
        uses: ./.github/actions/build-package

      - name: Display package artifacts
        uses: ./.github/actions/display-artifacts
        with:
          platform: Package
          artifact-pattern: rokt-widget-v*-*
          primary-filename: ${{ steps.build-and-package.outputs.package-filename }}
          icon: 📦
          artifacts-list: |
            Package tarball with version and commit hash
            Build metadata file

  build-test-ios:
    name: Build & Test iOS
    needs: build-package
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and flatten artifacts
        uses: ./.github/actions/download-and-flatten
        with:
          pattern: rokt-widget-v*-*
          path: Rokt.Widget/

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build and Test iOS
        id: build-ios
        uses: ./.github/actions/build-ios

      - name: Display artifact summary
        uses: ./.github/actions/display-artifacts
        with:
          platform: iOS
          artifact-pattern: rokt-ios-v*-*
          primary-filename: ${{ steps.build-ios.outputs.app-filename }}
          icon: 📱
          artifacts-list: |
            iOS Simulator app bundle (zipped)
            Test results (JUnit XML)
            Build metadata file

  build-test-android:
    name: Build & Test Android
    needs: build-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and flatten artifacts
        uses: ./.github/actions/download-and-flatten
        with:
          pattern: rokt-widget-v*-*
          path: Rokt.Widget/

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build and Test Android
        id: build-android
        uses: ./.github/actions/build-android

      - name: Display artifact summary
        uses: ./.github/actions/display-artifacts
        with:
          platform: Android
          artifact-pattern: rokt-android-v*-*
          primary-filename: ${{ steps.build-android.outputs.apk-filename }}
          icon: 🤖
          artifacts-list: |
            Android APK with version and commit hash
            Build metadata file

  setup-and-version:
    needs: [build-test-ios, build-test-android]
    runs-on: ubuntu-latest
    outputs:
      final_version: ${{ steps.version-file.outputs.release-version }}
      npm_tag: ${{ steps.version-file.outputs.npm-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get current version and npm dist-tag
        id: version-file
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version_from_file=$(head -n 1 VERSION)
          if [[ ! $version_from_file =~ ^([0-9]+)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: VERSION is not a semantic version: $version_from_file"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          prerelease="${BASH_REMATCH[2]}"
          # main owns "latest"; maintenance/<major>.x publishes only its own major, under
          # maintenance-<major>.x, since npm rejects range-like dist-tags such as "4.x".
          if [ "$REF_NAME" = "main" ]; then
            npm_tag="latest"
          elif [ "$REF_NAME" = "maintenance/${major}.x" ]; then
            npm_tag="maintenance-${major}.x"
          else
            echo "Error: $REF_NAME cannot publish version $version_from_file"
            exit 1
          fi
          # A prerelease never moves a stable dist-tag.
          if [ -n "$prerelease" ]; then
            npm_tag="next"
          fi
          echo "release-version=$version_from_file" >> $GITHUB_OUTPUT
          echo "npm-tag=$npm_tag" >> $GITHUB_OUTPUT

  publish-npm:
    needs: [build-package, setup-and-version]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # Required for npm OIDC trusted publishing
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-package.outputs.artifact-name }}
          path: Rokt.Widget/

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing requires npm 11.5.1+ (npm 12 requires Node 22+)
      - name: Update npm
        run: npm install -g npm@11.21.0

      - name: Publish to npm with OIDC
        shell: bash
        env:
          FINAL_VERSION: ${{ needs.setup-and-version.outputs.final_version }}
          NPM_TAG: ${{ needs.setup-and-version.outputs.npm_tag }}
          PACKAGE_SHA256: ${{ needs.build-package.outputs.package-sha256 }}
        run: |
          cd Rokt.Widget
          TARBALL="rokt-react-native-sdk-${FINAL_VERSION}.tgz"
          # Publish only the tarball build-package produced in this run.
          echo "${PACKAGE_SHA256}  ${TARBALL}" | sha256sum --check --strict -
          echo "Publishing tarball: $TARBALL with dist-tag: $NPM_TAG"
          npm publish "$TARBALL" --access=public --tag="$NPM_TAG"

  github-release:
    needs: [build-package, setup-and-version, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the GitHub release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-package.outputs.artifact-name }}
          path: Rokt.Widget/

      - name: Verify package tarball
        env:
          FINAL_VERSION: ${{ needs.setup-and-version.outputs.final_version }}
          PACKAGE_SHA256: ${{ needs.build-package.outputs.package-sha256 }}
        run: echo "${PACKAGE_SHA256}  Rokt.Widget/rokt-react-native-sdk-${FINAL_VERSION}.tgz" | sha256sum --check --strict -

      - uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0
        id: extract-release-notes
        with:
          changelog_file: CHANGELOG.md
          release_notes_file: ${{ needs.setup-and-version.outputs.final_version }}.md
      - name: Changelog
        env:
          RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
        run: printf '%s\n' "$RELEASE_NOTES"
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: release-notes
          path: ${{ needs.setup-and-version.outputs.final_version }}.md

      - name: Create Github release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          makeLatest: ${{ needs.setup-and-version.outputs.npm_tag == 'latest' }}
          tag: ${{ needs.setup-and-version.outputs.final_version }}
          commit: ${{ github.sha }}
          artifacts: Rokt.Widget/rokt-react-native-sdk-${{ needs.setup-and-version.outputs.final_version }}.tgz
          body: |
            ## Release notes:
            ${{ steps.extract-release-notes.outputs.release_notes }}
