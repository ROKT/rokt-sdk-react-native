name: Pull Request

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.changes.outputs.selection }}
      build_package: ${{ steps.changes.outputs.build_package }}
      android: ${{ steps.changes.outputs.android }}
      ios: ${{ steps.changes.outputs.ios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify change classifier
        run: bash .github/scripts/select-pr-jobs.spec.sh

      - name: Select required jobs
        id: changes
        env:
          SELECTOR_BASE_REF: ${{ github.event.pull_request.base.sha }}
          SELECTOR_FORCE_FULL: ${{ github.event_name != 'pull_request' }}
          SELECTOR_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash .github/scripts/select-pr-jobs.sh --github-output

  trunk-check:
    name: Trunk code check
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          check-mode: pull_request

  build-package:
    name: Build and Package Rokt.Widget
    if: needs.classify-changes.outputs.build_package == 'true'
    needs: [classify-changes, trunk-check]
    runs-on: ubuntu-latest
    outputs:
      package-filename: ${{ steps.build-and-package.outputs.package-filename }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Rokt.Widget/package-lock.json

      - name: Build and Package
        id: build-and-package
        uses: ./.github/actions/build-package

      - name: Display package artifacts
        uses: ./.github/actions/display-artifacts
        with:
          platform: Package
          artifact-pattern: rokt-widget-v*-*
          primary-filename: ${{ steps.build-and-package.outputs.package-filename }}
          icon: 📦
          artifacts-list: |
            Package tarball with version and commit hash
            Build metadata file

  build-test-ios:
    name: Build & Test iOS
    if: needs.classify-changes.outputs.ios == 'true'
    needs: [classify-changes, trunk-check, build-package]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and flatten artifacts
        uses: ./.github/actions/download-and-flatten
        with:
          pattern: rokt-widget-v*-*
          path: Rokt.Widget/

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build and Test iOS
        id: build-ios
        uses: ./.github/actions/build-ios

      - name: Display artifact summary
        uses: ./.github/actions/display-artifacts
        with:
          platform: iOS
          artifact-pattern: rokt-ios-v*-*
          primary-filename: ${{ steps.build-ios.outputs.app-filename }}
          icon: 📱
          artifacts-list: |
            iOS Simulator app bundle (zipped)
            Test results (JUnit XML)
            Build metadata file

  build-test-android:
    name: Build & Test Android
    if: needs.classify-changes.outputs.android == 'true'
    needs: [classify-changes, trunk-check, build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and flatten artifacts
        uses: ./.github/actions/download-and-flatten
        with:
          pattern: rokt-widget-v*-*
          path: Rokt.Widget/

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build and Test Android
        id: build-android
        uses: ./.github/actions/build-android

      - name: Display artifact summary
        uses: ./.github/actions/display-artifacts
        with:
          platform: Android
          artifact-pattern: rokt-android-v*-*
          primary-filename: ${{ steps.build-android.outputs.apk-filename }}
          icon: 🤖
          artifacts-list: |
            Android APK with version and commit hash
            Build metadata file

  pr-gate:
    name: PR Gate
    if: always()
    needs:
      - classify-changes
      - trunk-check
      - build-package
      - build-test-ios
      - build-test-android
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          CLASSIFIER_RESULT: ${{ needs.classify-changes.result }}
          TRUNK_RESULT: ${{ needs.trunk-check.result }}
          PACKAGE_SELECTED: ${{ needs.classify-changes.outputs.build_package }}
          PACKAGE_RESULT: ${{ needs.build-package.result }}
          IOS_SELECTED: ${{ needs.classify-changes.outputs.ios }}
          IOS_RESULT: ${{ needs.build-test-ios.result }}
          ANDROID_SELECTED: ${{ needs.classify-changes.outputs.android }}
          ANDROID_RESULT: ${{ needs.build-test-android.result }}
        run: |
          check_result() {
            local job_name="$1"
            local is_selected="$2"
            local result="$3"
            local expected_result='skipped'

            if [ "${is_selected}" = 'true' ]; then
              expected_result='success'
            fi

            if [ "${result}" != "${expected_result}" ]; then
              printf '%s: expected %s, got %s\n' "${job_name}" "${expected_result}" "${result}" >&2
              return 1
            fi
          }

          [ "${CLASSIFIER_RESULT}" = 'success' ]
          [ "${TRUNK_RESULT}" = 'success' ]
          check_result 'Build and Package Rokt.Widget' "${PACKAGE_SELECTED}" "${PACKAGE_RESULT}"
          check_result 'Build & Test iOS' "${IOS_SELECTED}" "${IOS_RESULT}"
          check_result 'Build & Test Android' "${ANDROID_SELECTED}" "${ANDROID_RESULT}"

  pr-notify:
    if: >
      needs.pr-gate.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    needs: pr-gate
    name: Notify GChat
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send Google Chat notification
        continue-on-error: true
        uses: SimonScholz/google-chat-action@3b3519e5102dba8aa5046fd711c4b553586409bb # v1.1.0
        with:
          webhookUrl: ${{ secrets.GCHAT_PRS_WEBHOOK }}
          title: PR Created - ${{ github.event.pull_request.title }}
          imageUrl: ${{ github.event.pull_request.user.avatar_url }}
          threadKey: ${{ github.repository }}-${{ github.event.pull_request.number }}
